<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <button id="addToShelf" >Add a Book</button>

        <dialog>
            <form>
                <label for="author">Author</label>
                <input type="text" name="author" id="author">
                
                <label for="title">Title</label>
                <input type="text" name="title" id="title">

                <label for="pages">Pages</label>
                <input type="text" name="pages" id="pages">
                
                <label for="publish">Publish Year</label>
                <input type="text" name="publish" id="publish">

                <label for="hasRead">Check if read</label>
                <input type="checkbox" id="hasRead" name="hasRead">


                <button type="submit" id="submit" name="submit">Submit</button>
                <button id="close" type="submit" formmethod="dialog">Cancel</button>

            </form>
        </dialog>
        <div class="shelf">

    </div>
    </div>
    <script src="library.js"></script>

</body>
</html>
